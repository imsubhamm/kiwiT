services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiwit
      POSTGRES_USER: kiwit_owner
      POSTGRES_PASSWORD: ${KIWIT_POSTGRES_PASSWORD:?set KIWIT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kiwit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwit_owner -d kiwit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  kiwit_postgres_data:
