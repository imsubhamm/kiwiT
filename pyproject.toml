[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwit"
version = "0.1.0"
description = "Production-oriented Indian-market research and paper-trading kernel"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
research = ["numpy>=2.0", "pandas>=2.2"]
production = ["psycopg[binary,pool]>=3.2,<4"]
workflow = ["langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4"]
api = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.13"]

[project.scripts]
kiwit = "kiwit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kiwit = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
