[application]
name = "kiwiT"
environment = "research"
timezone = "Asia/Kolkata"
currency = "INR"
live_execution_enabled = false

[risk]
risk_per_trade = "0.0025"
maximum_risk_per_trade = "0.0050"
maximum_open_risk = "0.0100"
maximum_correlated_risk = "0.0050"
daily_loss_limit_r = "1.0"
weekly_loss_limit_r = "3.0"
drawdown_throttle = "0.05"
drawdown_halt = "0.08"
maximum_positions = 4

[execution]
mode = "paper"
maximum_quote_age_seconds = 15
maximum_price_deviation = "0.01"
require_human_approval = true

