<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070B14"><title>Sign in · NitiQuant</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/login.css">
<link rel="stylesheet" href="/static/night.css">
<link rel="stylesheet" href="/static/light.css">
<link rel="stylesheet" href="/static/premium.css">
</head>
<body>
<video id="ambient-video" muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
  <main class="login-shell">
    <section class="login-copy"><span class="brand-mark">N</span><p>NITIQUANT · TRADING INTELLIGENCE</p><h1>Clarity before<br><em>capital.</em></h1><small>Secure access to research evidence and paper-only operations.</small></section>
    <section class="login-card">
      <span class="eyebrow">OPERATOR ACCESS</span><h2>Welcome back.</h2><p>Sign in to your protected NitiQuant workspace.</p>
      <form id="login-form">
        <label>Email<input id="email" type="email" autocomplete="username" required placeholder="operator@kiwit.com"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in <b>→</b></button>
      </form>
      <p id="login-error" role="alert"></p>
      <div class="guardrail"><i></i><span><strong>Paper-only environment</strong><small>Groww order execution is disabled</small></span></div>
    </section>
  </main>
  <script src="/static/login.js" defer></script>
<script src="/static/ambient-video.js" defer></script>
</body>
</html>
