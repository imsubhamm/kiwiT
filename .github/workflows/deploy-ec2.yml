name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiwit-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          KIWIT_DATABASE_URL: ${{ secrets.KIWIT_DATABASE_URL }}
          KIWIT_API_KEY: ${{ secrets.KIWIT_API_KEY }}
          KIWIT_GROWW_ACCESS_TOKEN: ${{ secrets.KIWIT_GROWW_ACCESS_TOKEN }}
          KIWIT_ADMIN_PASSWORD_HASH: ${{ secrets.KIWIT_ADMIN_PASSWORD_HASH }}
          KIWIT_SESSION_SECRET: ${{ secrets.KIWIT_SESSION_SECRET }}
          KIWIT_SMTP_PASSWORD: ${{ secrets.KIWIT_SMTP_PASSWORD }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER" && test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
          test -n "$KIWIT_DATABASE_URL" && test -n "$KIWIT_API_KEY"
          test -n "$KIWIT_ADMIN_PASSWORD_HASH" && test -n "$KIWIT_SESSION_SECRET"
          test -n "$KIWIT_SMTP_PASSWORD"
      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/kiwit.pem
          chmod 0600 ~/.ssh/kiwit.pem
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Build release archive
        run: git archive --format=tar.gz --output=/tmp/kiwit-release.tar.gz HEAD
      - name: Upload release and environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          KIWIT_DATABASE_URL: ${{ secrets.KIWIT_DATABASE_URL }}
          KIWIT_API_KEY: ${{ secrets.KIWIT_API_KEY }}
          KIWIT_GROWW_ACCESS_TOKEN: ${{ secrets.KIWIT_GROWW_ACCESS_TOKEN }}
          KIWIT_ADMIN_PASSWORD_HASH: ${{ secrets.KIWIT_ADMIN_PASSWORD_HASH }}
          KIWIT_SESSION_SECRET: ${{ secrets.KIWIT_SESSION_SECRET }}
          KIWIT_SMTP_PASSWORD: ${{ secrets.KIWIT_SMTP_PASSWORD }}
        run: |
          scp -i ~/.ssh/kiwit.pem /tmp/kiwit-release.tar.gz "$EC2_USER@$EC2_HOST:/tmp/kiwit-release.tar.gz"
          scp -i ~/.ssh/kiwit.pem deploy/remote_deploy.sh "$EC2_USER@$EC2_HOST:/tmp/remote_deploy.sh"
          printf "KIWIT_DATABASE_URL='%s'\nKIWIT_API_KEY='%s'\nKIWIT_DB_CONNECT_TIMEOUT=15\nKIWIT_ALLOWED_HOSTS='%s,localhost,127.0.0.1,characterization-parent-supplies-neo.trycloudflare.com'\nKIWIT_GROWW_ACCESS_TOKEN='%s'\nKIWIT_BROKER_TIMEOUT_SECONDS=8\nKIWIT_ADMIN_EMAIL='super.admin@kiwit.com'\nKIWIT_ADMIN_PASSWORD_HASH='%s'\nKIWIT_SESSION_SECRET='%s'\nKIWIT_SECURE_COOKIES=true\nKIWIT_INTRADAY_ENABLED=true\nKIWIT_INTRADAY_SYMBOLS='NIFTYBEES'\nKIWIT_PAPER_ACCOUNT_ID='kiwit-paper-main'\nKIWIT_SMTP_HOST='smtp.hostinger.com'\nKIWIT_SMTP_PORT=465\nKIWIT_SMTP_IMPLICIT_TLS=true\nKIWIT_SMTP_USERNAME='hellow@tathyaforge.in'\nKIWIT_SMTP_PASSWORD='%s'\nKIWIT_EMAIL_FROM='hellow@tathyaforge.in'\nKIWIT_ALERT_EMAIL='hellow@tathyaforge.in'\nKIWIT_DASHBOARD_URL='https://characterization-parent-supplies-neo.trycloudflare.com/dashboard'\nKIWIT_RELEASE_SHA='%s'\n" "$KIWIT_DATABASE_URL" "$KIWIT_API_KEY" "$EC2_HOST" "$KIWIT_GROWW_ACCESS_TOKEN" "$KIWIT_ADMIN_PASSWORD_HASH" "$KIWIT_SESSION_SECRET" "$KIWIT_SMTP_PASSWORD" "$GITHUB_SHA" > /tmp/kiwit.env
          scp -i ~/.ssh/kiwit.pem /tmp/kiwit.env "$EC2_USER@$EC2_HOST:/tmp/kiwit.env"
      - name: Deploy and health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/kiwit.pem "$EC2_USER@$EC2_HOST" "sudo install -o root -g kiwit -m 0640 /tmp/kiwit.env /etc/kiwit/kiwit.env && sudo bash /tmp/remote_deploy.sh /tmp/kiwit-release.tar.gz '$GITHUB_SHA'"
          curl --fail --retry 6 --retry-delay 5 --connect-timeout 5 --max-time 20 "http://$EC2_HOST/ready"
          test "$(curl --fail --silent --connect-timeout 5 --max-time 20 "http://$EC2_HOST/health" | python -c 'import json,sys; print(json.load(sys.stdin)["release"])')" = "$GITHUB_SHA"
