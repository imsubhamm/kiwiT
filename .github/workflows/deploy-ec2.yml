name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiwit-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KIWIT_DATABASE_URL: ${{ secrets.KIWIT_DATABASE_URL }}
          KIWIT_API_KEY: ${{ secrets.KIWIT_API_KEY }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER" && test -n "$EC2_SSH_KEY"
          test -n "$KIWIT_DATABASE_URL" && test -n "$KIWIT_API_KEY"
      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/kiwit.pem
          chmod 0600 ~/.ssh/kiwit.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Build release archive
        run: git archive --format=tar.gz --output=/tmp/kiwit-release.tar.gz HEAD
      - name: Upload release and environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          KIWIT_DATABASE_URL: ${{ secrets.KIWIT_DATABASE_URL }}
          KIWIT_API_KEY: ${{ secrets.KIWIT_API_KEY }}
        run: |
          scp -i ~/.ssh/kiwit.pem /tmp/kiwit-release.tar.gz "$EC2_USER@$EC2_HOST:/tmp/kiwit-release.tar.gz"
          scp -i ~/.ssh/kiwit.pem deploy/remote_deploy.sh "$EC2_USER@$EC2_HOST:/tmp/remote_deploy.sh"
          printf "KIWIT_DATABASE_URL='%s'\nKIWIT_API_KEY='%s'\nKIWIT_DB_CONNECT_TIMEOUT=15\n" "$KIWIT_DATABASE_URL" "$KIWIT_API_KEY" > /tmp/kiwit.env
          scp -i ~/.ssh/kiwit.pem /tmp/kiwit.env "$EC2_USER@$EC2_HOST:/tmp/kiwit.env"
      - name: Deploy and health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/kiwit.pem "$EC2_USER@$EC2_HOST" 'sudo install -o root -g kiwit -m 0640 /tmp/kiwit.env /etc/kiwit/kiwit.env && sudo bash /tmp/remote_deploy.sh /tmp/kiwit-release.tar.gz'
          curl --fail --retry 6 --retry-delay 5 --connect-timeout 5 --max-time 20 "http://$EC2_HOST/ready"
