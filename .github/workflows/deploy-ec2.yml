name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiwit-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml

  deploy:
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER" && test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/kiwit.pem
          chmod 0600 ~/.ssh/kiwit.pem
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Build release archive
        run: git archive --format=tar.gz --output=/tmp/kiwit-release.tar.gz HEAD
      - name: Upload release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -o ConnectTimeout=15 -i ~/.ssh/kiwit.pem /tmp/kiwit-release.tar.gz "$EC2_USER@$EC2_HOST:/tmp/kiwit-release.tar.gz"
          scp -o ConnectTimeout=15 -i ~/.ssh/kiwit.pem deploy/remote_deploy.sh "$EC2_USER@$EC2_HOST:/tmp/remote_deploy.sh"
      - name: Deploy and health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o ConnectTimeout=15 -i ~/.ssh/kiwit.pem "$EC2_USER@$EC2_HOST" "sudo test -f /etc/kiwit/kiwit.env && sudo bash /tmp/remote_deploy.sh /tmp/kiwit-release.tar.gz '$GITHUB_SHA'"
          ssh -o ConnectTimeout=15 -i ~/.ssh/kiwit.pem "$EC2_USER@$EC2_HOST" "curl --fail --silent http://127.0.0.1:8001/ready"
          test "$(ssh -o ConnectTimeout=15 -i ~/.ssh/kiwit.pem "$EC2_USER@$EC2_HOST" 'curl --fail --silent http://127.0.0.1:8001/health' | python -c 'import json,sys; print(json.load(sys.stdin)["release"])')" = "$GITHUB_SHA"
