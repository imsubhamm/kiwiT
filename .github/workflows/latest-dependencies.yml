name: Latest dependency compatibility (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiwit_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kiwit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwit_test -d kiwit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KIWIT_TEST_DATABASE_URL: postgresql://kiwit_test:ci-only-password@localhost:5432/kiwit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # Deliberately separate from release CI: never produces release evidence.
      - run: python -m pip install --timeout 20 --retries 2 '.[api,production,workflow,research,ml,llm,dev]'
      - run: pytest -q
