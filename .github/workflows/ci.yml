name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiwit_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kiwit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwit_test -d kiwit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KIWIT_TEST_DATABASE_URL: postgresql://kiwit_test:ci-only-password@localhost:5432/kiwit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api,production,workflow,research,dev]'
      - run: ruff check src/kiwit/api.py src/kiwit/brokers src/kiwit/observability.py src/kiwit/database.py src/kiwit/langgraph_workflow.py src/kiwit/paper_trading.py src/kiwit/intraday.py src/kiwit/paper_session.py src/kiwit/banknifty.py src/kiwit/options_ai.py src/kiwit/options_market.py src/kiwit/chart_analysis.py
      - run: pytest -q
      - run: ruff check src/kiwit/playbooks.py src/kiwit/options_risk.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dashboard-controls.test.cjs
      - run: node --test tests/banknifty-dashboard.test.cjs
