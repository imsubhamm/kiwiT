name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api,production,workflow,research,dev]'
      - run: ruff check src/kiwit/api.py src/kiwit/brokers src/kiwit/observability.py src/kiwit/database.py src/kiwit/langgraph_workflow.py src/kiwit/paper_trading.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dashboard-controls.test.cjs
