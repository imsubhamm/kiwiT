name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api,production,workflow,research]' pip-audit bandit
      - name: Audit dependencies
        run: pip-audit
      - name: Static security analysis
        run: bandit -q -r src scripts -x tests
      - name: Reject committed private keys
        run: |
          if git grep -I -n -- 'BEGIN .*PRIVATE KEY' -- ':!*.md' ':!.github/workflows/security.yml'; then
            echo 'Private key material detected in tracked files' >&2
            exit 1
          fi
