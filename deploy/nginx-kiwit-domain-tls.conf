# Activate only after Certbot issues this hostname's certificate.
server {
    listen 80;
    listen [::]:80;
    server_name kiwit.tathyaforge.in;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kiwit-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://kiwit.tathyaforge.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiwit.tathyaforge.in;
    ssl_certificate /etc/letsencrypt/live/kiwit.tathyaforge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiwit.tathyaforge.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:kiwit_tls:10m;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Hostname-only HSTS; do not affect other tathyaforge.in services.
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_hide_header Server;
    location /api/v1/auth/ {
        limit_req zone=kiwit_auth burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /metrics {
        limit_req zone=kiwit_auth burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/ {
        limit_req zone=kiwit_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / { proxy_pass http://127.0.0.1:8000; }
}
