# Bootstrap vhost: certificate validation only; never serve a login over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name kiwit.tathyaforge.in;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kiwit-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "kiwiT HTTPS setup is pending. Please use the existing secure dashboard.\n";
    }
}
